name: PyBot Network Explorer — cross-platform verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Standard-library unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: One-click macOS launcher through the real pinned PyBot
        if: runner.os == 'macOS'
        env:
          PYBOT_NETWORK_SELF_CHECK: '1'
        run: |
          bash -n start_mac.command
          bash start_mac.command
      - name: One-click Windows launcher through the real pinned PyBot
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYBOT_NETWORK_SELF_CHECK: '1'
        run: call start_windows.bat
  real-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q network launch.py tests tools
          node --check web/app.js
      - name: Real-source graph test
        run: python -m tools.upstream_smoke
